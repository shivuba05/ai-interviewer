<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f1a36" stroke="#1d2f5e" stroke-width="2" />
  <!-- Brain / Neural Nodes -->
  <circle cx="32" cy="18" r="4" fill="url(#grad)" />
  <circle cx="20" cy="30" r="3.5" fill="url(#grad)" />
  <circle cx="44" cy="30" r="3.5" fill="url(#grad)" />
  <circle cx="24" cy="44" r="3.5" fill="url(#grad)" />
  <circle cx="40" cy="44" r="3.5" fill="url(#grad)" />
  <!-- Connecting Synapse Lines -->
  <line x1="32" y1="18" x2="20" y2="30" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="18" x2="44" y2="30" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="30" x2="24" y2="44" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="44" y1="30" x2="40" y2="44" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="30" x2="44" y2="30" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="24" y1="44" x2="40" y2="44" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <!-- Central Pulse -->
  <circle cx="32" cy="33" r="5" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="2" />
  <circle cx="32" cy="33" r="2" fill="#ffffff" />
</svg>

